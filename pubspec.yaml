name: travela
description: "Travela — property search with live streaming results."
# Prevents accidental publishing to pub.dev.
publish_to: 'none'

# App version: <major>.<minor>.<patch>+<build>.
# Android uses versionName/versionCode; iOS uses CFBundleShortVersionString/CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0
  dio: ^5.11.0
  pretty_dio_logger: ^1.3.1
  retrofit: ^4.9.2
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.2.1
  font_awesome_flutter: ^11.0.0
  flutter_spinkit: ^5.2.2
  cached_network_image: ^3.4.1
  custom_refresh_indicator: ^4.0.1
  skeletonizer: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation: run `dart run build_runner build` after model/endpoint changes
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.8

  # Lints (configured in analysis_options.yaml)
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
